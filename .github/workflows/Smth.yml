name: Compile RAW2BMP and Convert

on:
  push:
    paths:
      - 'input/*.bmp'
  workflow_dispatch:

permissions:
  contents: write # Allows GitHub to save the converted files to your repo

jobs:
  build-and-convert:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile RAW2BMP Tool
        shell: cmd
        run: |
          msbuild RAW2BMP.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143
          
          # FIX: Automatically find RAW2BMP.exe wherever it was compiled and copy it to the root
          for /r %%i in (RAW2BMP.exe) do copy "%%i" .\raw2bmp.exe
        
      - name: Convert BMP files to RAW
        shell: cmd
        run: |
          mkdir output
          for %%f in (input\*.bmp) do (
              raw2bmp.exe "%%f" "output\%%~nf.raw"
          )

      - name: Commit RAW files back to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add output/*.raw
          git commit -m "Automated conversion: BMP to RAW" || exit 0
          git push
